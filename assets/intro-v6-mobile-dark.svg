<svg xmlns="http://www.w3.org/2000/svg" width="420" height="110" viewBox="0 0 420 110" fill="none" role="img" aria-labelledby="title"><title id="title">Build, learn, repeat. Making useful things with a creative touch; connecting interfaces to real workflows; exploring local AI and agent workflows.</title><g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"><style>.phrase{animation:words 15s ease-in-out infinite}.two{animation-delay:-10s}.three{animation-delay:-5s}.beacon{animation:beacon 2.5s ease-in-out infinite}@keyframes words{0%,26%{opacity:1;transform:translateY(0)}29%,96%{opacity:0;transform:translateY(-8px)}97%{opacity:0;transform:translateY(8px)}100%{opacity:1;transform:translateY(0)}}@keyframes beacon{50%{opacity:.55;transform:scale(1.18)}}.beacon{transform-box:fill-box;transform-origin:center}@media(prefers-reduced-motion:reduce){.phrase,.beacon{animation:none;transform:none}.one{opacity:1}.two,.three{opacity:0}}</style><rect x="1" y="1" width="418" height="108" rx="14" fill="#101e2b" stroke="#395a70"/><circle class="beacon" cx="23" cy="24" r="5" fill="#90cdb0"/><text x="38" y="28" fill="#a5bdce" font-size="10" font-weight="650" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', monospace" letter-spacing="1.1">BUILD. LEARN. REPEAT.</text><g class="phrase one" opacity="1"><text x="22" y="65" fill="#e1edf5" font-size="23" font-weight="650" >making useful things</text><text x="22" y="94" fill="#e1edf5" font-size="23" font-weight="650" >with a creative touch.</text></g><g class="phrase two" opacity="0"><text x="22" y="65" fill="#e1edf5" font-size="23" font-weight="650" >connecting interfaces</text><text x="22" y="94" fill="#e1edf5" font-size="23" font-weight="650" >to real workflows.</text></g><g class="phrase three" opacity="0"><text x="22" y="65" fill="#e1edf5" font-size="23" font-weight="650" >exploring local AI</text><text x="22" y="94" fill="#e1edf5" font-size="23" font-weight="650" >&amp; agent workflows.</text></g></g></svg>
