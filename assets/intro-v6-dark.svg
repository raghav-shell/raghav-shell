<svg xmlns="http://www.w3.org/2000/svg" width="960" height="84" viewBox="0 0 960 84" fill="none" role="img" aria-labelledby="title"><title id="title">Build, learn, repeat. Making useful things with a creative touch; connecting interfaces to real workflows; exploring local AI and agent workflows.</title><g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"><style>.phrase{animation:words 15s ease-in-out infinite}.two{animation-delay:-10s}.three{animation-delay:-5s}.beacon{animation:beacon 2.5s ease-in-out infinite}@keyframes words{0%,26%{opacity:1;transform:translateY(0)}29%,96%{opacity:0;transform:translateY(-8px)}97%{opacity:0;transform:translateY(8px)}100%{opacity:1;transform:translateY(0)}}@keyframes beacon{50%{opacity:.55;transform:scale(1.18)}}.beacon{transform-box:fill-box;transform-origin:center}@media(prefers-reduced-motion:reduce){.phrase,.beacon{animation:none;transform:none}.one{opacity:1}.two,.three{opacity:0}}</style><rect x="1" y="1" width="958" height="82" rx="14" fill="#101e2b" stroke="#395a70"/><circle class="beacon" cx="30" cy="41" r="7" fill="#90cdb0"/><text x="52" y="27" fill="#a5bdce" font-size="11" font-weight="650" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', monospace" letter-spacing="1.2">BUILD. LEARN. REPEAT.</text><g class="phrase one" opacity="1"><text x="51" y="59" fill="#e1edf5" font-size="26" font-weight="650" letter-spacing="-.5">making useful things with a creative touch.</text></g><g class="phrase two" opacity="0"><text x="51" y="59" fill="#e1edf5" font-size="26" font-weight="650" letter-spacing="-.5">connecting interfaces to real workflows.</text></g><g class="phrase three" opacity="0"><text x="51" y="59" fill="#e1edf5" font-size="26" font-weight="650" letter-spacing="-.5">exploring local AI &amp; agent workflows.</text></g></g></svg>
