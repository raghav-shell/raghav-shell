name: Check garden game
on:
  push:
    branches: [main]
    paths: ['docs/game/**', 'tests/game*.test.mjs', '.github/workflows/game.yml']
  pull_request:
    paths: ['docs/game/**', 'tests/game*.test.mjs', '.github/workflows/game.yml']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/game*.test.mjs
