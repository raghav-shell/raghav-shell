name: Refresh Firefly Trail
on:
  schedule:
    - cron: '23 3 * * *' # 08:53 IST, daily
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/update_garden.py
      - scripts/build_artwork_v4.py
      - scripts/build_artwork_v5.py
      - tests/test_update_garden.py
      - .github/workflows/garden.yml

permissions:
  contents: read

concurrency:
  group: profile-refresh
  cancel-in-progress: false

jobs:
  refresh:
    if: github.repository == 'raghav-shell/raghav-shell' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check calendar validation and artwork
        run: python -m unittest discover -s tests -v
      - name: Follow the real contribution calendar
        run: python scripts/update_garden.py
      - name: Save the latest garden
        run: |
          git add README.md assets/contributions/
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: refresh contribution firefly garden'
          git push
