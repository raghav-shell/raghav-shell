name: Refresh daily Raghav fact
on:
  schedule:
    - cron: '19 3 * * *' # 08:49 IST, daily
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/update_fact.py
      - data/raghav-facts.json
      - tests/test_update_fact.py
      - .github/workflows/facts.yml

permissions:
  contents: read

# Share the writer lock with the existing activity refresher.
concurrency:
  group: profile-refresh
  cancel-in-progress: false

jobs:
  refresh:
    if: github.repository == 'raghav-shell/raghav-shell' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check daily rotation and safe rendering
        run: python -m unittest discover -s tests -v
      - name: Rotate the daily joke
        run: python scripts/update_fact.py
      - name: Commit the daily grin
        run: |
          git add README.md assets/facts/
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: refresh daily Raghav fact'
          git push
